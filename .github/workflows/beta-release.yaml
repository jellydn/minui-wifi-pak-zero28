---
name: "beta-release"

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04-arm
    if: github.actor == 'jellydn'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Create release
        run: make clean build release

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"

  validate:
    name: validate
    runs-on: ubuntu-24.04
    needs: build
    if: github.actor == 'jellydn'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Pak Name
        id: pak-name
        run: |
          echo "PAK_NAME=$(jq -r .name pak.json)" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: "${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          path: "dist"

      - name: Validate Artifact
        run: |
          set -euo pipefail
          zipfile="dist/${{ steps.pak-name.outputs.PAK_NAME }}.pak.zip"
          if [ ! -f "$zipfile" ]; then
            echo "Artifact does not exist"
            exit 1
          fi
          echo "Artifact size: $(stat --printf='%s' "$zipfile") bytes"

          # Verify expected files are in the zip
          unzip -l "$zipfile" | grep "zero28" || {
            echo "ERROR: zero28 files not found in zip"
            exit 1
          }

          unzip -l "$zipfile" | grep "launch.sh" || {
            echo "ERROR: launch.sh not found in zip"
            exit 1
          }

          echo "Artifact validated successfully"
